# Start EVDI with one device. Hermes needs a device to exist before a session
# asks for a virtual display, and adding one later is root-only
# (/sys/devices/evdi/add). Same option the Arch package's install script writes
# to /etc/modprobe.d/hermes-evdi.conf, which overrides this file when present.
options evdi initial_device_count=1
