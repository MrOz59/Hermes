name: Build Hermes

on:
  push:
    branches: [master, main]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release
  COMMIT: ${{ github.sha }}

  # Every Linux package builds its CUDA against the same toolkit, so they all
  # encode on the same set of NVIDIA cards. It cannot come from the distros:
  # Hermes compiles its own RGBA-to-NV12 kernel, CUDA 13 dropped code generation
  # for every compute capability below 7.5, and CUDA 13 is all that NVIDIA's
  # repositories offer for the current releases - which left Maxwell through
  # Volta with no kernel image at all and NVENC failing on the first frame.
  # 12.9 is the last toolkit that still emits those architectures, and it costs
  # only sm_110, a datacenter part; scripts/install_cuda_redist.sh fetches it
  # from the redistributable archives, which no release gets to decide for us.
  #
  # nvcc 12.9 refuses a host compiler newer than GCC 14, and every one of these
  # releases now ships something newer, so scripts/install_cuda_host_gcc.sh
  # finds a GCC 14 for nvcc alone. Only cuda.cu goes through it.
  CUDA_VERSION: "12.9.1"
  CUDA_HOST_GCC: "14"

jobs:
  # ===========================================
  # Build version (VERSION file + commit stamp)
  # ===========================================
  # A stable release (a `v*` tag) ships the bare VERSION number. Every other
  # build — nightly, PR, manual dispatch — gets the short commit appended as
  # SemVer build metadata (`0.5.1+abc1234`), so any nightly a user reports from
  # can be traced back to the exact commit that produced it.
  #
  # `+` is the one separator all three package formats accept (Arch pkgver
  # forbids `-`, rpm Version forbids `-`), and under SemVer build metadata
  # sorts equal to the plain version instead of below it — which is correct: a
  # nightly is 0.5.1 *plus* commits, not a 0.5.1 pre-release.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      build_version: ${{ steps.compute.outputs.build_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute build version
        id: compute
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            build_version="${version}"
          else
            build_version="${version}+${GITHUB_SHA:0:7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${build_version}"

  # ===========================================
  # Unit / integration tests (Arch container)
  # ===========================================
  # Builds with -DBUILD_TESTS=ON and runs the GoogleTest suite via ctest.
  # Hardware-dependent cases self-skip with GTEST_SKIP on headless runners.
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Setup Arch Linux
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            git \
            git-lfs \
            cmake \
            ninja \
            boost \
            openssl \
            opus \
            ffmpeg \
            libdrm \
            wayland \
            libx11 \
            libxrandr \
            libxfixes \
            libxcb \
            libva \
            libvdpau \
            libcap \
            curl \
            libevdev \
            systemd \
            miniupnpc \
            libpulse \
            qt6-base \
            qt6-svg \
            npm \
            nodejs \
            icu \
            numactl \
            xorg-server-xvfb \
            sway \
            jq

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Configure CMake (with tests)
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSUNSHINE_ENABLE_WAYLAND=ON \
            -DSUNSHINE_ENABLE_X11=ON \
            -DSUNSHINE_ENABLE_DRM=ON \
            -DSUNSHINE_ENABLE_CUDA=OFF \
            -DBUILD_TESTS=ON

      - name: Build tests
        run: cmake --build build --target test_sunshine -j$(nproc)

      # The Web UI had no test of any kind, which is how a computed feeding the
      # root render came to blank the whole home page over one field of the
      # wrong type. These run on their own vitest config: vite.config.js is
      # driven by the CMake environment and builds the pages through ejs,
      # neither of which a unit test needs.
      - name: Run the Web UI tests
        # npm install rather than npm ci: package-lock.json is gitignored here,
        # and the web-ui CMake target installs the same way.
        run: |
          npm install
          npm test

      - name: Run tests
        # The suite is a single GoogleTest binary (no ctest registration);
        # run it directly as documented in docs/contributing.md. Run under
        # xvfb so platf::init() finds an X11 capture source on the headless
        # runner (otherwise the platform-dependent suites fail their setup).
        run: xvfb-run -a ./build/tests/test_sunshine --gtest_color=yes

      # The hard part of this project is what a compositor does with the
      # outputs Hermes asks it for, and until now no test could see one: every
      # Wayland case skipped itself on a runner with nothing on WAYLAND_DISPLAY.
      # A wlroots compositor on the headless backend needs no GPU and no seat,
      # so the layout the capture and input paths read - logical sizes, a
      # fractional scale, an output beside another - can be laid out for real.
      #
      # Software rendering means no linux-dmabuf, so the dmabuf capture cases
      # still skip; this covers the geometry, which is where the reported bugs
      # were. The fixture mirrors the reported layout: a 4K output at scale 1.6
      # (which is 1.6015625 in the 24.8 fixed point the protocol carries) with
      # a 1080p output beside it.
      - name: Start a headless compositor
        run: |
          # Arch ships sway with a file capability. execve() of a file whose
          # permitted set holds a capability the process cannot receive fails
          # outright with EPERM, and a container does not get SYS_NICE by
          # default, so sway would never start. It does not need the capability
          # here.
          setcap -r /usr/bin/sway 2>/dev/null || true

          # Not named wayland-anything: the search below looks for 'wayland-*'
          # and find reports its own starting point first, so a runtime
          # directory matching that glob becomes the answer and WAYLAND_DISPLAY
          # ends up naming a directory. -mindepth 1 -type s settles it either
          # way; the name is the belt to that pair of braces.
          export XDG_RUNTIME_DIR=/tmp/hermes-test-runtime
          mkdir -p "${XDG_RUNTIME_DIR}"
          chmod 700 "${XDG_RUNTIME_DIR}"
          echo 'exec sleep infinity' > /tmp/sway-fixture.config

          # WLR_BACKENDS is plural; the singular form is ignored silently and
          # wlroots then autodetects DRM and fails for lack of a seat.
          WLR_BACKENDS=headless \
          WLR_HEADLESS_OUTPUTS=2 \
          WLR_LIBINPUT_NO_DEVICES=1 \
          WLR_RENDERER=pixman \
          XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR}" \
            sway -c /tmp/sway-fixture.config > /tmp/sway.log 2>&1 &

          for _ in $(seq 1 60); do
            socket="$(find "${XDG_RUNTIME_DIR}" -mindepth 1 -maxdepth 1 -type s -name 'wayland-*' | head -n1)"
            [ -n "${socket}" ] && break
            sleep 0.5
          done
          if [ -z "${socket}" ]; then
            echo "sway did not come up:"; cat /tmp/sway.log; exit 1
          fi

          export WAYLAND_DISPLAY="$(basename "${socket}")"

          # swaymsg finds sway's IPC socket through SWAYSOCK, which sway exports
          # only to its own children. It also appears a moment after the Wayland
          # socket, so it needs a wait of its own: reading it once, right after
          # the loop above, is a race that comes up empty and leaves the outputs
          # at their defaults with nothing failing.
          for _ in $(seq 1 40); do
            SWAYSOCK="$(find "${XDG_RUNTIME_DIR}" -mindepth 1 -maxdepth 1 -type s -name 'sway-ipc.*.sock' | head -n1)"
            [ -n "${SWAYSOCK}" ] && break
            sleep 0.25
          done
          if [ -z "${SWAYSOCK}" ]; then
            echo "sway is up but never exposed an IPC socket:"; cat /tmp/sway.log; exit 1
          fi
          export SWAYSOCK

          swaymsg output HEADLESS-1 mode 3840x2160 scale 1.6 position 0 0
          swaymsg output HEADLESS-2 mode 1920x1080 scale 1 position 2400 0
          swaymsg -t get_outputs | jq -r '.[] | "\(.name) mode=\(.current_mode.width)x\(.current_mode.height) scale=\(.scale) logical=\(.rect.width)x\(.rect.height) at \(.rect.x),\(.rect.y)"'

          {
            echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}"
            echo "WAYLAND_DISPLAY=${WAYLAND_DISPLAY}"
            echo "SWAYSOCK=${SWAYSOCK}"
          } >> "$GITHUB_ENV"

      - name: Run the Wayland tests against it
        # A second pass over the same binary, seconds rather than another build.
        # It is kept separate from the run above so the X11 pass keeps testing
        # what it always did: platf::init() prefers Wayland when both are set,
        # which would silently move the platform suites off X11.
        run: |
          ./build/tests/test_sunshine --gtest_color=yes --gtest_filter='Wayland*' \
            --gtest_output=json:/tmp/wayland-tests.json

          # Every case in this suite skips itself when it cannot reach a
          # compositor, which is right on a developer's machine and useless
          # here: the whole point of the step above is that one is running. A
          # fixture that quietly stops being applied - a socket that is not
          # found, a scale that is not set - would leave this job green while
          # covering nothing, which is the failure this suite exists to catch.
          skipped="$(jq -r '
            [.testsuites[] | select(.name == "WaylandLiveLayoutTest")
             | .testsuite[] | select(.result != "COMPLETED") | .name] | join(", ")
          ' /tmp/wayland-tests.json)"
          if [ -n "${skipped}" ]; then
            echo "::error::The compositor fixture is not reaching the tests. Skipped: ${skipped}"
            echo "--- sway log ---"; cat /tmp/sway.log
            exit 1
          fi
          echo "The live layout suite ran against the compositor."

  # ===========================================
  # Windows Build
  # ===========================================
  # Temporarily disabled: Hermes targets Linux hosts, and the Windows build
  # currently fails on a pre-existing Boost.Process v1 inline-namespace
  # incompatibility with the MSYS2 GCC toolchain (unrelated to Hermes). Set
  # `if: false` to skip rather than fail the run; remove to re-enable.
  build-windows:
    if: false
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-opus
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-miniupnpc
            mingw-w64-ucrt-x86_64-nlohmann-json
            mingw-w64-ucrt-x86_64-onevpl
            mingw-w64-ucrt-x86_64-MinHook
            mingw-w64-ucrt-x86_64-nodejs
            mingw-w64-ucrt-x86_64-qt6-base
            mingw-w64-ucrt-x86_64-qt6-svg
            git

      - name: Configure CMake
        shell: msys2 {0}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DSUNSHINE_ENABLE_WAYLAND=OFF \
            -DSUNSHINE_ENABLE_X11=OFF \
            -DSUNSHINE_ENABLE_DRM=OFF \
            -DSUNSHINE_ENABLE_CUDA=ON \
            -DFETCHCONTENT_FULLY_DISCONNECTED=OFF

      - name: Build
        shell: msys2 {0}
        run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(nproc)

      - name: Package
        shell: msys2 {0}
        run: |
          mkdir -p package/apollo
          cp build/sunshine*.exe package/apollo/apollo.exe 2>/dev/null || cp build/apollo*.exe package/apollo/ 2>/dev/null || true
          cp -r build/assets/web package/apollo/ 2>/dev/null || true
          
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apollo-windows-x64
          path: package/
          retention-days: 30
          if-no-files-found: ignore

  # ===========================================
  # Arch Linux Package (PKGBUILD)
  # ===========================================
  build-arch-pkg:
    # Gate every package build on the test suite: nothing is compiled, and
    # therefore nothing is ever released or published as nightly, unless the
    # tests pass first.
    needs: [test, version]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    # Defining both BRANCH and BUILD_VERSION makes cmake/prep/build_version.cmake
    # take the version verbatim from the environment instead of deriving it from
    # the git checkout.
    env:
      BRANCH: ${{ github.ref_name }}
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}

    steps:
      # Cache the downloaded pacman packages so a run pays the extraction cost
      # rather than the download; pacman keeps them in /var/cache/pacman/pkg.
      # The CUDA toolkit is no longer among them - see the CUDA step below.
      - name: Cache pacman packages
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: pacman-arch-cuda-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            pacman-arch-cuda-

      - name: Setup Arch Linux
        run: |
          pacman -Syu --noconfirm
          # nvcc does not come from pacman here - the CUDA step below explains
          # why - but the build still fails without it (CUDA_FAIL_ON_MISSING=ON).
          # wget and zstd are what the two CUDA scripts need to fetch and unpack.
          pacman -S --noconfirm --needed \
            base-devel \
            wget \
            zstd \
            git \
            git-lfs \
            cmake \
            ninja \
            boost \
            openssl \
            opus \
            ffmpeg \
            libdrm \
            wayland \
            libx11 \
            libxrandr \
            libxfixes \
            libxcb \
            libva \
            libvdpau \
            libcap \
            curl \
            libevdev \
            systemd \
            miniupnpc \
            libpulse \
            qt6-base \
            qt6-svg \
            npm \
            nodejs \
            icu \
            numactl

          # Create build user (makepkg can't run as root)
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          
      # makepkg cannot take pkgver from the environment, so rewrite it in the
      # CI checkout. This keeps the package filename, the pacman version and
      # the version the binary reports all in agreement.
      - name: Stamp the build version into the PKGBUILD
        run: |
          sed -i "s/^pkgver=.*/pkgver=${BUILD_VERSION}/" PKGBUILD
          grep '^pkgver=' PKGBUILD

      - name: Fix permissions and git
        run: |
          chown -R builder:builder .
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # Arch's own `cuda` package is 13.x, which would leave this package
      # unable to encode on anything older than Turing; see the CUDA_VERSION
      # comment at the top of the workflow. Both halves are installed system
      # wide as root, world-readable, so the unprivileged makepkg build below
      # can use them.
      - name: Install CUDA toolkit
        run: |
          host_cxx="$(scripts/install_cuda_host_gcc.sh "${CUDA_HOST_GCC}")"
          scripts/install_cuda_redist.sh "${CUDA_VERSION}"
          echo "CUDA_HOST_CXX=${host_cxx}" >> "${GITHUB_ENV}"

      # Build the real Arch package straight from the PKGBUILD, so CI and a
      # local `makepkg -si` produce the exact same
      # hermes-streaming-*.pkg.tar.zst (same paths, service, deps). makepkg
      # refuses to run as root, hence the `builder` user created above.
      - name: Build package with makepkg
        run: |
          # nvcc is not on the default PATH, and CMake's check_language(CUDA)
          # has to find it or NVENC is silently left out. CUDAHOSTCXX is what
          # points nvcc at a compiler it accepts; the PKGBUILD takes both from
          # the environment, so a local `makepkg` against Arch's own toolkit
          # still works unchanged.
          # `su` does not carry the job environment across, so the build vars
          # are passed explicitly rather than inherited.
          su builder -c "export PATH=/usr/local/cuda/bin:\$PATH \
            CUDAHOSTCXX='${CUDA_HOST_CXX}' \
            BRANCH='${BRANCH}' \
            BUILD_VERSION='${BUILD_VERSION}' \
            COMMIT='${COMMIT}'; \
            makepkg -sf --noconfirm"

      - name: Upload Arch Package
        uses: actions/upload-artifact@v4
        with:
          name: hermes-streaming-arch-pkg
          # Both the package and its symbols. The -debug package is what makes a
          # user's coredump readable; publishing only the stripped binary is why
          # the crash reports so far could not be resolved past raw offsets.
          path: |
            *.pkg.tar.zst
          retention-days: 30
          if-no-files-found: error

  # ===========================================
  # Debian/Ubuntu Package (.deb)
  # ===========================================
  # One package per supported Ubuntu LTS, for the same reason the RPM job
  # builds per Fedora release: the libraries a package links move between
  # releases. The build runs in a plain `ubuntu:<release>` container rather than
  # on the runner image, so the binary can only link what that release actually
  # ships - a runner image carries a great deal of extra software, and anything
  # the build picked up from it would become a dependency users do not have.
  #
  # Add a row when a new LTS ships and drop it at EOL:
  # https://wiki.ubuntu.com/Releases
  build-deb:
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both releases build their CUDA the same way; see the CUDA_VERSION
          # comment at the top of the workflow.
          - ubuntu: "24.04"
          - ubuntu: "26.04"
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    env:
      DEBIAN_FRONTEND: noninteractive
      BRANCH: ${{ github.ref_name }}
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}

    steps:
      # Before the checkout: a bare container has no git, and the submodule
      # checkout needs one.
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            git \
            wget \
            xz-utils \
            build-essential \
            cmake \
            ninja-build \
            libssl-dev \
            libboost-all-dev \
            libpulse-dev \
            libopus-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libdrm-dev \
            libgbm-dev \
            libwayland-dev \
            libx11-dev \
            libxrandr-dev \
            libxfixes-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libva-dev \
            libvdpau-dev \
            libcap-dev \
            libcurl4-openssl-dev \
            libevdev-dev \
            libudev-dev \
            libsystemd-dev \
            libminiupnpc-dev \
            libicu-dev \
            libnuma-dev \
            libqt6svg6-dev \
            qt6-base-dev \
            dpkg-dev \
            debhelper

      # Node comes from setup-node, not apt: Ubuntu 24.04 still ships Node 18,
      # which went EOL in April 2025, while 26.04 ships 22. Pinning one version
      # keeps both packages' Web UI built by the same toolchain - the same major
      # the Fedora containers provide.
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # Install the CUDA toolkit so the .deb ships NVIDIA NVENC, matching the
      # Arch and RPM packages. Only nvcc, its runtime and the headers it needs
      # are fetched, never the driver stack; CMake links libcudart statically,
      # so nothing of the toolkit follows into the package. Runs after the
      # checkout because both halves are scripts out of the tree.
      - name: Install CUDA toolkit
        run: |
          host_cxx="$(scripts/install_cuda_host_gcc.sh "${CUDA_HOST_GCC}")"
          scripts/install_cuda_redist.sh "${CUDA_VERSION}"
          echo "CUDAHOSTCXX=${host_cxx}" >> "${GITHUB_ENV}"
          echo "/usr/local/cuda/bin" >> "${GITHUB_PATH}"

      - name: Configure CMake
        run: |
          # SUNSHINE_ASSETS_DIR is baked into the binary at compile time and must
          # match where the package actually puts the assets (/usr/share/hermes).
          # Without it the default is `assets`, which unix.cmake turns into
          # /usr/assets, and the Web UI 404s on every page it tries to serve.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSUNSHINE_ASSETS_DIR=share/hermes \
            -DSUNSHINE_ENABLE_WAYLAND=ON \
            -DSUNSHINE_ENABLE_X11=ON \
            -DSUNSHINE_ENABLE_DRM=ON \
            -DCUDA_FAIL_ON_MISSING=ON

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(nproc)

      - name: Create DEB Package
        run: |
          VERSION="${BUILD_VERSION}"
          PKGDIR="hermes_${VERSION}_amd64"

          # Everything the package ships comes from the project's own install
          # rules, as the Arch package already does. Assembling the tree here
          # by hand is what left the .deb without icons and with a cut-down
          # copy of the systemd unit, and the .rpm without a menu entry at
          # all (#52).
          packaging/linux/stage-install.sh build "${PKGDIR}" > /dev/null
          mkdir -p ${PKGDIR}/DEBIAN

          # Derive the dependencies from what the binary actually links, the
          # way debhelper does for a normal Debian build. The hand-written list
          # this replaces was wrong in both directions: it required
          # libboost-all-dev - a build-time -dev metapackage, and Boost is
          # linked statically here anyway - while naming neither libicu nor
          # libminiupnpc, the two libraries whose sonames actually move between
          # releases (24.04 has libicu74/libminiupnpc17, 26.04 libicu78/
          # libminiupnpc21). A missing entry is the worse half of that: apt
          # installs the package without complaint and the binary then fails to
          # start, which is far harder to diagnose than a refused install.
          #
          # dpkg-shlibdeps reads debian/control for the package name, so give it
          # a throwaway one rather than a full debian/ source tree.
          BIN_PATH="${PKGDIR}/usr/bin/hermes"
          mkdir -p .shlibdeps/debian
          printf 'Source: hermes\nPackage: hermes\nArchitecture: amd64\n' \
            > .shlibdeps/debian/control
          DEB_DEPENDS="$(cd .shlibdeps \
            && dpkg-shlibdeps -O --ignore-missing-info "${BIN_PATH}" \
            | sed 's/^shlibs:Depends=//')"
          rm -rf .shlibdeps
          if [ -z "${DEB_DEPENDS}" ]; then
            echo "dpkg-shlibdeps produced no dependencies" >&2
            exit 1
          fi
          echo "Generated Depends: ${DEB_DEPENDS}"

          # Create control file
          cat > ${PKGDIR}/DEBIAN/control << EOF
          Package: hermes
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: ${DEB_DEPENDS}
          Recommends: evdi-dkms
          Maintainer: Hermes
          Description: Self-hosted game stream host with Linux virtual display support
           Hermes is an Apollo-derived game streaming server with low-latency
           Linux virtual displays via Hermes-KMS (EVDI also supported).
          EOF

          # Create postinst script
          cat > ${PKGDIR}/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          setcap cap_sys_admin+p /usr/bin/hermes || true
          if command -v modprobe &> /dev/null; then
            modprobe evdi 2>/dev/null || true
          fi
          gtk-update-icon-cache -f /usr/share/icons/hicolor/ 2>/dev/null || true
          update-desktop-database /usr/share/applications 2>/dev/null || true
          EOF
          chmod 755 ${PKGDIR}/DEBIAN/postinst

          # The systemd unit and the three desktop entries come from the
          # staged install. The unit written here before was a cut-down copy:
          # it lacked the monitor recovery run on stop, and was wanted only by
          # xdg-desktop-autostart.target, which Game Mode sessions never
          # activate - so the package undid the fix that makes Hermes start
          # there.

          # Build package. The release goes in the filename so the two builds
          # are told apart on the release page - the control Version stays the
          # plain upstream version, so neither package looks like an upgrade of
          # the other.
          dpkg-deb --build ${PKGDIR} \
            hermes_${VERSION}_ubuntu${{ matrix.ubuntu }}_amd64.deb

      - name: Upload DEB Package
        uses: actions/upload-artifact@v4
        with:
          name: hermes-deb-ubuntu${{ matrix.ubuntu }}
          # Only the Hermes package, not build-time debs (e.g. cuda-keyring).
          path: "hermes_*.deb"
          retention-days: 30
          if-no-files-found: error

  # ===========================================
  # Fedora RPM Build
  # ===========================================
  # One package per supported Fedora release, not one package for "Fedora".
  # rpmbuild derives a package's Requires from the sonames the binary actually
  # linked against, so a build picks up whatever ICU and miniupnpc the build
  # container shipped (libicuuc.so.74, libminiupnpc.so.17 on Fedora 40) and then
  # refuses to install anywhere those have moved on. A single build on an
  # already-EOL release left every current Fedora unable to install it.
  #
  # Add a row when Fedora branches a new release and drop it when that release
  # goes EOL: https://docs.fedoraproject.org/en-US/releases/eol/
  build-rpm:
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both releases build their CUDA the same way; see the CUDA_VERSION
          # comment at the top of the workflow. Fedora 43 still packages gcc14,
          # Fedora 44 does not, and install_cuda_host_gcc.sh covers the second
          # case by taking the compat compiler from the release that has it.
          - fedora: "43"
          - fedora: "44"
    container:
      image: fedora:${{ matrix.fedora }}
    env:
      BRANCH: ${{ github.ref_name }}
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}

    steps:
      - name: Install Dependencies
        run: |
          dnf install -y \
            git \
            cmake \
            ninja-build \
            gcc-c++ \
            boost-devel \
            openssl-devel \
            opus-devel \
            ffmpeg-free-devel \
            libdrm-devel \
            mesa-libgbm-devel \
            wayland-devel \
            libX11-devel \
            libXrandr-devel \
            libXfixes-devel \
            libxcb-devel \
            libva-devel \
            libvdpau-devel \
            libcap-devel \
            libcurl-devel \
            libevdev-devel \
            systemd-devel \
            miniupnpc-devel \
            pulseaudio-libs-devel \
            libicu-devel \
            numactl-devel \
            qt6-qtbase-devel \
            qt6-qtsvg-devel \
            rpm-build \
            wget \
            nodejs \
            npm

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Fix git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # Install the CUDA toolkit so the .rpm ships NVIDIA NVENC, matching the
      # Arch and DEB packages. cmake/compile_definitions/linux.cmake reads the
      # toolkit's version and narrows the architecture list on its own, so which
      # toolkit lands here is what decides the package's GPU coverage - see the
      # matrix above. Runs after the checkout because the redistributable path
      # needs a script out of the tree.
      - name: Install CUDA toolkit
        run: |
          host_cxx="$(scripts/install_cuda_host_gcc.sh "${CUDA_HOST_GCC}")"
          scripts/install_cuda_redist.sh "${CUDA_VERSION}"
          echo "CUDAHOSTCXX=${host_cxx}" >> "${GITHUB_ENV}"
          echo "/usr/local/cuda/bin" >> "${GITHUB_PATH}"

      - name: Configure CMake
        run: |
          # Must match where the RPM installs the assets (/usr/share/hermes);
          # see the DEB job for why the default would break the Web UI.
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DSUNSHINE_ASSETS_DIR=share/hermes \
            -DSUNSHINE_ENABLE_WAYLAND=ON \
            -DSUNSHINE_ENABLE_X11=ON \
            -DSUNSHINE_ENABLE_DRM=ON \
            -DCUDA_FAIL_ON_MISSING=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Create RPM Package
        run: |
          VERSION="${BUILD_VERSION}"
          mkdir -p ~/rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}

          # The package used to be the binary and the asset tree, and nothing
          # else: no menu entries, no icons, not even the systemd unit, so it
          # installed and then could not be found or started (#52). Stage the
          # project's own install instead, as every other package does.
          packaging/linux/stage-install.sh build "hermes-${VERSION}" > /dev/null
          tar -czf ~/rpmbuild/SOURCES/hermes-${VERSION}.tar.gz hermes-${VERSION}

          # %files is generated from that tree, so a file CMake starts or stops
          # installing cannot silently fall in or out of the package.
          FILE_LIST="$(cd hermes-${VERSION} && {
            find . -type d -path './usr/share/hermes*' -printf '%%dir /%P\n'
            find . \( -type f -o -type l \) -printf '/%P\n'
          } | sort)"

          cat > ~/rpmbuild/SPECS/hermes.spec << EOF
          Name:           hermes
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        Self-hosted game stream host with Linux virtual display support
          License:        GPLv3
          URL:            https://github.com/MrOz59/Hermes
          Source0:        hermes-%{version}.tar.gz

          # The binary is built by the job above and only copied in %install, so
          # there are no sources for a debuginfo package to point at. Left on,
          # rpmbuild would emit a second .rpm that ships as a release asset.
          %global debug_package %{nil}

          %description
          Hermes is an Apollo-derived game streaming server with low-latency
          Linux virtual displays via Hermes-KMS (EVDI also supported).

          %prep
          %setup -q

          %install
          mkdir -p %{buildroot}
          cp -a usr %{buildroot}/

          %files
          %defattr(-,root,root,-)
          ${FILE_LIST}

          %post
          setcap cap_sys_admin+p /usr/bin/hermes || true
          EOF

          rpmbuild -bb ~/rpmbuild/SPECS/hermes.spec
          cp ~/rpmbuild/RPMS/*/*.rpm .

      # The release jobs collect artifacts/**/*, so each leg needs its own
      # artifact name; the packages themselves are already distinct, since
      # %{?dist} stamps the release as .fc43 / .fc44.
      - name: Upload RPM
        uses: actions/upload-artifact@v4
        with:
          name: hermes-rpm-fc${{ matrix.fedora }}
          path: "*.rpm"
          retention-days: 30
          if-no-files-found: error

  # ===========================================
  # Create Release (on tag)
  # ===========================================
  # Promoting a nightly to a stable release is done by pushing a vX.Y.Z tag
  # (scripts/bump-version.sh does this). The tag push re-runs the full pipeline
  # — test -> build -> release — so a stable release is always freshly built
  # from tested sources rather than reusing a nightly artifact. Because every
  # build job needs [test], this release cannot publish unless the suite passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-arch-pkg, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================
  # Nightly Release (rolling prerelease on main)
  # ===========================================
  # Every successful push to main refreshes the single "nightly" prerelease
  # with the latest Linux artifacts. The tag is force-moved to the current
  # commit so the release always points at the newest build.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build-deb, build-arch-pkg, build-rpm]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: List artifacts
        run: find artifacts/ -type f

      # Moved through the API rather than with `git push`. The push is
      # authenticated as the github-actions App, and GitHub refuses a ref push
      # that carries a change to .github/workflows without the `workflows`
      # permission - which GITHUB_TOKEN cannot be granted, because there is no
      # such key in the `permissions:` block. So every commit that touches a
      # workflow file failed to publish a nightly, with the packages built and
      # the release never updated. Updating a ref to a commit that is already
      # on the remote adds no file content, and is not subject to that check.
      - name: Move nightly tag to current commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="${GITHUB_SHA}" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/nightly" -f sha="${GITHUB_SHA}"

      - name: Clear stale nightly assets
        run: |
          # Remove all assets from the existing nightly release so a version
          # bump never leaves old-versioned packages behind. Ignores the case
          # where the release doesn't exist yet.
          for asset in $(gh release view nightly --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset nightly "$asset" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: nightly
          name: "Hermes nightly (v${{ needs.version.outputs.build_version }})"
          body: |
            Rolling nightly build of Hermes from the `main` branch.

            - Version: `v${{ needs.version.outputs.build_version }}`
            - Commit: ${{ github.sha }}
            - Built: ${{ github.event.head_commit.timestamp }}

            > These artifacts are automatically rebuilt on every push to
            > `main` and may be unstable. For tagged releases see the
            > non-prerelease entries.
          files: |
            artifacts/**/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
