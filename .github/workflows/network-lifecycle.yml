name: Network lifecycle regressions

on:
  push:
    branches: [main, master, fix/issue-71-stream-reconnect, experimental/isolated-session-improvements, release/october-integration]
    paths:
      - 'src/network.*'
      - 'src/thread_safe.h'
      - 'src/stream.cpp'
      - 'src/platform/linux/clipboard_process.h'
      - 'src/platform/linux/misc.cpp'
      - 'tests/unit/test_clipboard_process.cpp'
      - 'tests/unit/test_network.cpp'
      - 'tests/helpers/executed_helper.h'
      - 'tests/unit/test_thread_safe.cpp'
      - 'tests/network_lifecycle/**'
      - 'mcpp.toml'
      - 'scripts/prepare-mcpp-ci.sh'
      - '.github/workflows/network-lifecycle.yml'
  pull_request:
    paths:
      - 'src/network.*'
      - 'src/thread_safe.h'
      - 'src/stream.cpp'
      - 'src/platform/linux/clipboard_process.h'
      - 'src/platform/linux/misc.cpp'
      - 'tests/unit/test_clipboard_process.cpp'
      - 'tests/unit/test_network.cpp'
      - 'tests/helpers/executed_helper.h'
      - 'tests/unit/test_thread_safe.cpp'
      - 'tests/network_lifecycle/**'
      - 'mcpp.toml'
      - 'scripts/prepare-mcpp-ci.sh'
      - '.github/workflows/network-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize only the test dependencies
        run: |
          git submodule update --init --depth 1 third-party/googletest third-party/moonlight-common-c
          git -C third-party/moonlight-common-c submodule update --init --depth 1 enet
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build libboost-log-dev libboost-system-dev nlohmann-json3-dev
      - name: Prepare mcpp with the runner toolchain
        run: |
          export MCPP_HOME="$RUNNER_TEMP/hermes-mcpp"
          export MCPP_TOOLCHAIN="path:$RUNNER_TEMP/hermes-gcc"
          scripts/prepare-mcpp-ci.sh 14
          mkdir -p .toolchain/boost/stage
          ln -s "/usr/lib/$(gcc-14 -dumpmachine)" .toolchain/boost/stage/lib
          printf 'MCPP_HOME=%s\nMCPP_TOOLCHAIN=%s\n' "$MCPP_HOME" "$MCPP_TOOLCHAIN" >> "$GITHUB_ENV"
          printf '%s\n' "$MCPP_HOME/bin" >> "$GITHUB_PATH"
      - name: Build with sanitizers
        run: mcpp build --offline --profile sanitize -p hermes-network-lifecycle -j2
      - name: Test socket cleanup and reconnect
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: mcpp run --offline --profile sanitize -p hermes-network-lifecycle network_lifecycle_tests -- --gtest_color=yes

      - name: Stress post-exec socket release and inheritance detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: mcpp run --offline --profile sanitize -p hermes-network-lifecycle network_lifecycle_tests -- --gtest_color=yes --gtest_filter='HostCreateTests/HostCreateTest.*ExecutedHelper*' --gtest_repeat=100
