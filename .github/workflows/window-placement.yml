name: KWin window placement regressions

on:
  pull_request:
    paths:
      - 'src/process.cpp'
      - 'src/platform/linux/window_placement.h'
      - 'src/platform/linux/virtual_display.*'
      - 'tests/window_placement/**'
      - '.node-version'
      - '.github/workflows/window-placement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  placement:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Install GCC 14 for C++26
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends g++-14
      - name: Compile the production KWin script generator
        run: g++-14 -std=c++2c -Wall -Wextra -Werror -I. tests/window_placement/script.cc -o /tmp/hermes-placement-script
      - name: Preserve unrelated local windows and fullscreen state
        env:
          HERMES_PLACEMENT_SCRIPT_GENERATOR: /tmp/hermes-placement-script
        run: node --test tests/window_placement/kwin_script.cjs
