name: Network lifecycle regressions

on:
  push:
    branches: [main, master, fix/issue-71-stream-reconnect, experimental/isolated-session-improvements, release/october-integration]
    paths:
      - 'src/network.*'
      - 'src/thread_safe.h'
      - 'src/stream.cpp'
      - 'src/platform/linux/clipboard_process.h'
      - 'src/platform/linux/misc.cpp'
      - 'tests/unit/test_clipboard_process.cpp'
      - 'tests/unit/test_network.cpp'
      - 'tests/helpers/executed_helper.h'
      - 'tests/unit/test_thread_safe.cpp'
      - 'tests/network_lifecycle/**'
      - '.github/workflows/network-lifecycle.yml'
  pull_request:
    paths:
      - 'src/network.*'
      - 'src/thread_safe.h'
      - 'src/stream.cpp'
      - 'src/platform/linux/clipboard_process.h'
      - 'src/platform/linux/misc.cpp'
      - 'tests/unit/test_clipboard_process.cpp'
      - 'tests/unit/test_network.cpp'
      - 'tests/helpers/executed_helper.h'
      - 'tests/unit/test_thread_safe.cpp'
      - 'tests/network_lifecycle/**'
      - '.github/workflows/network-lifecycle.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  network-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize only the test dependencies
        run: |
          git submodule update --init --depth 1 third-party/googletest third-party/moonlight-common-c
          git -C third-party/moonlight-common-c submodule update --init --depth 1 enet
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libboost-log-dev libboost-system-dev nlohmann-json3-dev
      - name: Configure with sanitizers
        run: cmake -S tests/network_lifecycle -B build-network -G Ninja -DCMAKE_BUILD_TYPE=Debug -DHERMES_TEST_SANITIZERS=ON
      - name: Build
        run: cmake --build build-network --parallel 2
      - name: Test socket cleanup and reconnect
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-network --output-on-failure

      - name: Stress post-exec socket release and inheritance detection
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: build-network/network_lifecycle_tests --gtest_color=yes --gtest_filter='HostCreateTests/HostCreateTest.*ExecutedHelper*' --gtest_repeat=100
