---
version: 2

build:
  os: ubuntu-26.04
  tools:
    # Read the Docs requires a managed tool when using build jobs. Bun runs the build.
    nodejs: "26"
  apt_packages:
    - doxygen
    - graphviz
    - jq
    - unzip
  jobs:
    build:
      html:
        - scripts/build-readthedocs.sh

submodules:
  include: all
  recursive: true
