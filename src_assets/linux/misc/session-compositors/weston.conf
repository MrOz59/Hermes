# Session compositor profile: weston.
#
# This is the profile Hermes ships and tests. Selected with
# `hermes_kms_session_compositor = weston` (the default).
#
# Placeholders expanded in `command` and `env`:
#   {card}        primary node basename of the session card, e.g. card2
#   {card_path}   /dev/dri/{card}
#   {seat}        the private DRM seat, e.g. hermes-kms-1
#   {socket}      Wayland socket name Hermes expects (empty when discovered)
#   {log}         a writable log path inside the session's runtime directory
#   {runtime_dir} the session's private XDG_RUNTIME_DIR
#   {render_node} render node of a real GPU, e.g. /dev/dri/renderD128
#   {width} {height} {refresh}   the mode the client asked for
#   {connector}   connector name, e.g. Virtual-2
#
# socket = given      Hermes names the socket and passes it to the compositor
# socket = discovered the compositor names its own; Hermes finds it afterwards
#
# NOTE: weston renders on whichever card it scans out from, and both
# --drm-device and --additional-devices take KMS nodes only - a render node is
# refused with "is not a KMS device". The only KMS node with a real GPU belongs
# to seat0, which a session on a private seat cannot open, so weston composites
# this session in software (llvmpipe). A compositor that takes a render node
# separately from its display device does not have that limit.
#
# config-template is read from beside this file and written, with placeholders
# expanded, to config-target inside the session's own runtime directory. {config}
# expands to that path.
requires        = weston
socket          = given
config-template = weston.ini.template
config-target   = {runtime_dir}/weston.ini
command         = weston --backend=drm --drm-device={card} --seat={seat} --continue-without-input --socket={socket} --xwayland --shell=desktop --idle-time=0 --log={log} --config={config}
