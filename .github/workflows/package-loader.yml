name: Package secure loader
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  loader:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: ['fedora:43', 'fedora:44', 'ubuntu:24.04', 'ubuntu:26.04']
    container:
      image: ${{ matrix.image }}
    steps:
      - name: Install fixture dependencies
        run: |
          if command -v dnf >/dev/null; then
            dnf install -y git gcc binutils libcap util-linux shadow-utils python3 pkgconf-pkg-config patchelf
          else
            apt-get update
            # libc6-dev is only a Recommends of gcc, and the ubuntu:26.04 image
            # no longer installs those; without it the linker misses crti.o.
            apt-get install -y git gcc libc6-dev binutils libcap2-bin util-linux passwd python3 pkg-config patchelf
          fi
      - uses: actions/checkout@v4
      - name: Test the native mcpp staging rule with capabilities
        run: bash scripts/tests/mcpp-pyrowave-runtime-loader.sh
