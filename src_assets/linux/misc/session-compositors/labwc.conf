# Session compositor profile: labwc.
#
# Selected with `hermes_kms_session_compositor = labwc`.
#
# Why this profile exists: weston takes KMS nodes only, for both its display
# and its rendering device, and the only KMS node backed by a real GPU belongs
# to seat0 - which a session on a private DRM seat cannot open. A session under
# weston therefore composites on llvmpipe. wlroots takes the two separately,
# and a render node carries no seat assignment, so a session under labwc scans
# out on its own card while rendering on the real GPU.
#
# READ THIS BEFORE SELECTING IT. It does not yet work on a Hermes-KMS card, and
# the reason is the driver rather than anything here. wlroots allocates an
# output's scanout buffers through GBM on the *display device's own* render
# node - the kernel pairs /dev/dri/cardN with a renderDN of the same driver, and
# that is the one it asks. Hermes-KMS exposes a capture-only render node with no
# Mesa driver behind it, so Mesa falls back to kms_swrast, which allocates with
# DRM_IOCTL_MODE_CREATE_DUMB, which the kernel refuses on any render node. The
# session comes up, sees its output, and fails every swapchain:
#
#   [render/allocator/gbm.c] gbm_bo_create failed: Permission denied
#   [types/output/swapchain.c] Swapchain for output 'Virtual-N' failed test
#
# Verified in a virtme-ng guest, where labwc did open the private-seat card and
# did accept the render split - everything below is right - and then failed
# there. weston does not hit it because it allocates dumb buffers on the card
# node, where the kernel permits them, which is also why it ends up on llvmpipe.
#
# What would close it is a driver whose render node Mesa can drive, or none at
# all. Until then this profile is for a KMS device that has one: keep
# `hermes_kms_session_compositor = weston` for Hermes-KMS sessions.
#
# See weston.conf for the full placeholder list.

requires = labwc

# labwc names its own Wayland socket; Hermes finds it afterwards.
socket = discovered

# WLR_DRM_DEVICES is the card the session scans out on - its own, on its own
# seat. WLR_RENDER_DRM_DEVICE is the GPU it renders with, which is the whole
# point of this profile.
#
# LIBSEAT_BACKEND=noop is what lets it open that card. wlroots opens DRM devices
# through libseat, whose logind backend resolves the *calling process's* logind
# session - and a session started as a transient unit has none, on a seat that
# is not seat0 anyway. The noop backend opens the path directly instead, which
# is exactly right here: the Hermes-KMS card carries a per-card access_uid set
# to this session's account, so the permission to open it is already granted,
# and DRM master follows from being the first to open a card nobody else has.
env = WLR_BACKENDS=drm, WLR_DRM_DEVICES={card_path}, WLR_RENDER_DRM_DEVICE={render_node}, LIBSEAT_BACKEND=noop

# labwc reads its configuration out of a directory, so config-target names a
# file inside one and the command is given the directory. The autostart file is
# executed as a shell script once the compositor is up.
config-template = labwc-autostart.template
config-target   = {runtime_dir}/labwc/autostart

command = labwc -C {config_dir}
