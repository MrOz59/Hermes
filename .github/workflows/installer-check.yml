name: Hermes installer validation

on:
  push:
    paths:
      - 'scripts/install.sh'
      - 'scripts/tests/installer-*.sh'
      - 'README.md'
      - '.github/workflows/installer-check.yml'
  pull_request:
    paths:
      - 'scripts/install.sh'
      - 'scripts/tests/installer-*.sh'
      - 'README.md'
      - '.github/workflows/installer-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  installer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check bash syntax and CLI entrypoint
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash scripts/install.sh --help > /tmp/hermes-installer-help.txt
          grep -q -- '--dry-run' /tmp/hermes-installer-help.txt
          grep -q -- '--nightly' /tmp/hermes-installer-help.txt
          grep -q -- '--update' /tmp/hermes-installer-help.txt
          grep -q -- 'GITHUB_TOKEN' /tmp/hermes-installer-help.txt
          grep -q 'run_updater()' scripts/install.sh
          grep -q 'Hermes-KMS' scripts/install.sh
          grep -q 'KWIN VIRTUAL DESKTOP' scripts/install.sh
          grep -q 'configure_isolation_method()' scripts/install.sh
          grep -q 'install_kms_broker()' scripts/install.sh
          grep -q 'post_install_checks()' scripts/install.sh
      - name: Offline installer helper tests
        shell: bash
        run: bash scripts/tests/installer-offline.sh
      - name: ShellCheck errors
        shell: bash
        run: |
          set -euo pipefail
          shellcheck --severity=error scripts/install.sh scripts/tests/installer-offline.sh scripts/tests/installer-dry-run.sh

  # Resolves every supported distribution's packages from the real releases
  # (Hermes stable and nightly, Hermes-KMS v0.4.1) through a full --dry-run.
  # It depends on the published releases, so it is kept apart from the
  # offline checks above.
  dry-run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Dry runs against the published releases
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=GITHUB_TOKEN bash scripts/tests/installer-dry-run.sh "$USER"
