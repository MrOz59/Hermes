name: Build Hermes

on:
  push:
    # Build test packages for #71; release/nightly jobs remain gated below.
    branches: [master, main, fix/pairing-reliability, fix/issue-71-stream-reconnect, feature/pyrowave-codec, release/october-integration, 'release/*-rc*', refactor/modularization-modernization]
    tags:
      - 'v*'
  pull_request:
    branches: [master, main, release/october-integration, refactor/modularization-modernization]
  workflow_dispatch:

concurrency:
  group: hermes-build-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  COMMIT: ${{ github.sha }}

  # Every Linux package builds its CUDA against the same toolkit, so they all
  # encode on the same set of NVIDIA cards. It cannot come from the distros:
  # Hermes compiles its own RGBA-to-NV12 kernel, CUDA 13 dropped code generation
  # for every compute capability below 7.5, and CUDA 13 is all that NVIDIA's
  # repositories offer for the current releases - which left Maxwell through
  # Volta with no kernel image at all and NVENC failing on the first frame.
  # 12.9 is the last toolkit that still emits those architectures, and it costs
  # only sm_110, a datacenter part; scripts/install_cuda_redist.sh fetches it
  # from the redistributable archives, which no release gets to decide for us.
  #
  # nvcc 12.9 refuses a host compiler newer than GCC 14, and every one of these
  # releases now ships something newer, so scripts/install_cuda_host_gcc.sh
  # finds a GCC 14 for nvcc alone. Only cuda.cu goes through it.
  CUDA_VERSION: "12.9.1"
  CUDA_HOST_GCC: "14"

jobs:
  package-loader:
    uses: ./.github/workflows/package-loader.yml
    permissions:
      contents: read

  # ===========================================
  # Build version (VERSION file + commit stamp)
  # ===========================================
  # A stable release (a `v*` tag) ships the bare VERSION number. Every other
  # build — nightly, PR, manual dispatch — gets the short commit appended as
  # SemVer build metadata (`0.5.1+abc1234`), so any nightly a user reports from
  # can be traced back to the exact commit that produced it.
  #
  # `+` is the one separator all three package formats accept (Arch pkgver
  # forbids `-`, rpm Version forbids `-`), and under SemVer build metadata
  # sorts equal to the plain version instead of below it — which is correct: a
  # nightly is 0.5.1 *plus* commits, not a 0.5.1 pre-release.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      build_version: ${{ steps.compute.outputs.build_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Compute build version
        id: compute
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            build_version="${version}"
          elif [[ "${GITHUB_REF_NAME}" =~ ^release/[a-z]+-[0-9]{4}-rc([0-9]+)$ ]]; then
            # RPM/ALPM sort numeric segments above alpha segments. A numeric
            # source date sorts after RC1's seven-character hexadecimal suffix
            # on all three package managers; use the commit date for repeatability.
            rc_number="${BASH_REMATCH[1]}"
            source_date="$(git show -s --format=%cs HEAD | tr -d '-')"
            build_version="${version}+${source_date}.rc${rc_number}.${GITHUB_SHA:0:7}"
          else
            build_version="${version}+${GITHUB_SHA:0:7}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "build_version=${build_version}" >> "$GITHUB_OUTPUT"
          echo "Build version: ${build_version}"

  # ===========================================
  # Unit / integration tests (Arch container)
  # ===========================================
  # Builds the full GoogleTest suite with mcpp.
  # Hardware-dependent cases self-skip with GTEST_SKIP on headless runners.
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Setup Arch Linux
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed \
            base-devel \
            git \
            git-lfs \
            ninja \
            python \
            nlohmann-json \
            openssl \
            opus \
            ffmpeg \
            libdrm \
            wayland \
            libx11 \
            libxrandr \
            libxfixes \
            libxcb \
            libxext \
            libxtst \
            libva \
            libvdpau \
            libcap \
            acl \
            curl \
            libevdev \
            systemd \
            miniupnpc \
            libpipewire \
            libpulse \
            qt6-base \
            qt6-svg \
            icu \
            numactl \
            xorg-server-xvfb \
            sway \
            vulkan-headers \
            vulkan-icd-loader \
            jq

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Fix git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Prepare mcpp and native test inputs
        shell: bash
        run: |
          export MCPP_HOME="$RUNNER_TEMP/hermes-mcpp"
          export MCPP_TOOLCHAIN="path:$RUNNER_TEMP/hermes-gcc"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/hermes-runtime"
          install -d -m 700 "$XDG_RUNTIME_DIR"

          scripts/prepare-mcpp-ci.sh
          scripts/prepare-mcpp-linux-sdk.sh
          printf 'MCPP_HOME=%s\nMCPP_TOOLCHAIN=%s\nXDG_RUNTIME_DIR=%s\n' \
            "$MCPP_HOME" "$MCPP_TOOLCHAIN" "$XDG_RUNTIME_DIR" >> "$GITHUB_ENV"
          printf '%s\n' "$MCPP_HOME/bin" >> "$GITHUB_PATH"

      - name: Build pinned PyroWave SDK
        run: bash scripts/build-pyrowave-sdk.sh

      # Vitest exercises the Web UI without running the Vite asset build.
      - name: Run the Web UI tests
        # The checkout keeps package-lock.json outside version control.
        run: |
          npm install
          npm test

      - name: Compile the full Linux test suite
        shell: bash
        env:
          HERMES_MCPP_QT_MOC: /usr/lib/qt6/moc
        run: |
          mcpp test --no-run --no-programs --offline -p hermes-host \
            --features tray,pyrowave,web-assets,xtest --profile coverage \
            --message-format json > "$RUNNER_TEMP/hermes-test-build.jsonl"
          test_binary="$(jq -ser '[.[] | select(.status == "built") | .launch.argv[0]] |
            if length == 1 then .[0] else error("expected the Hermes test executable") end' \
            "$RUNNER_TEMP/hermes-test-build.jsonl")"
          test -x "$test_binary"
          echo "HERMES_TEST_BINARY=$test_binary" >> "$GITHUB_ENV"

      - name: Run tests
        # Xvfb supplies the X11 capture source for the headless platform suites.
        run: xvfb-run -a "$HERMES_TEST_BINARY" --gtest_color=yes

      # The hard part of this project is what a compositor does with the
      # outputs Hermes asks it for, and until now no test could see one: every
      # Wayland case skipped itself on a runner with nothing on WAYLAND_DISPLAY.
      # A wlroots compositor on the headless backend needs no GPU and no seat,
      # so the layout the capture and input paths read - logical sizes, a
      # fractional scale, an output beside another - can be laid out for real.
      #
      # Software rendering means no linux-dmabuf, so the dmabuf capture cases
      # still skip; this covers the geometry, which is where the reported bugs
      # were. The fixture mirrors the reported layout: a 4K output at scale 1.6
      # (which is 1.6015625 in the 24.8 fixed point the protocol carries) with
      # a 1080p output beside it.
      - name: Start a headless compositor
        run: |
          # The headless fixture does not need Arch's installed SYS_NICE capability.
          fixture="$RUNNER_TEMP/hermes-sway"
          install -m 755 /usr/bin/sway "$fixture"

          # Not named wayland-anything: the search below looks for 'wayland-*'
          # and find reports its own starting point first, so a runtime
          # directory matching that glob becomes the answer and WAYLAND_DISPLAY
          # ends up naming a directory. -mindepth 1 -type s settles it either
          # way; the name is the belt to that pair of braces.
          export XDG_RUNTIME_DIR=/tmp/hermes-test-runtime
          mkdir -p "${XDG_RUNTIME_DIR}"
          chmod 700 "${XDG_RUNTIME_DIR}"
          printf '%s\n' 'xwayland disable' > /tmp/sway-fixture.config

          # WLR_BACKENDS is plural; the singular form is ignored silently and
          # wlroots then autodetects DRM and fails for lack of a seat.
          WLR_BACKENDS=headless \
          WLR_HEADLESS_OUTPUTS=2 \
          WLR_LIBINPUT_NO_DEVICES=1 \
          WLR_RENDERER=pixman \
          XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR}" \
            "$fixture" -c /tmp/sway-fixture.config > /tmp/sway.log 2>&1 &

          for _ in $(seq 1 60); do
            socket="$(find "${XDG_RUNTIME_DIR}" -mindepth 1 -maxdepth 1 -type s -name 'wayland-*' | head -n1)"
            [ -n "${socket}" ] && break
            sleep 0.5
          done
          if [ -z "${socket}" ]; then
            echo "sway did not come up:"; cat /tmp/sway.log; exit 1
          fi

          export WAYLAND_DISPLAY="$(basename "${socket}")"

          # swaymsg finds sway's IPC socket through SWAYSOCK, which sway exports
          # only to its own children. It also appears a moment after the Wayland
          # socket, so it needs a wait of its own: reading it once, right after
          # the loop above, is a race that comes up empty and leaves the outputs
          # at their defaults with nothing failing.
          for _ in $(seq 1 40); do
            SWAYSOCK="$(find "${XDG_RUNTIME_DIR}" -mindepth 1 -maxdepth 1 -type s -name 'sway-ipc.*.sock' | head -n1)"
            [ -n "${SWAYSOCK}" ] && break
            sleep 0.25
          done
          if [ -z "${SWAYSOCK}" ]; then
            echo "sway is up but never exposed an IPC socket:"; cat /tmp/sway.log; exit 1
          fi
          export SWAYSOCK

          swaymsg output HEADLESS-1 mode 3840x2160 scale 1.6 position 0 0
          swaymsg output HEADLESS-2 mode 1920x1080 scale 1 position 2400 0
          swaymsg -t get_outputs | jq -r '.[] | "\(.name) mode=\(.current_mode.width)x\(.current_mode.height) scale=\(.scale) logical=\(.rect.width)x\(.rect.height) at \(.rect.x),\(.rect.y)"'

          {
            echo "XDG_RUNTIME_DIR=${XDG_RUNTIME_DIR}"
            echo "WAYLAND_DISPLAY=${WAYLAND_DISPLAY}"
            echo "SWAYSOCK=${SWAYSOCK}"
          } >> "$GITHUB_ENV"

      - name: Run the Wayland tests against it
        # A second pass over the same binary, seconds rather than another build.
        # It is kept separate from the run above so the X11 pass keeps testing
        # what it always did: platf::init() prefers Wayland when both are set,
        # which would silently move the platform suites off X11.
        run: |
          "$HERMES_TEST_BINARY" --gtest_color=yes --gtest_filter='Wayland*' \
            --gtest_output=json:/tmp/wayland-tests.json

          # Every case in this suite skips itself when it cannot reach a
          # compositor, which is right on a developer's machine and useless
          # here: the whole point of the step above is that one is running. A
          # fixture that quietly stops being applied - a socket that is not
          # found, a scale that is not set - would leave this job green while
          # covering nothing, which is the failure this suite exists to catch.
          skipped="$(jq -r '
            [.testsuites[] | select(.name == "WaylandLiveLayoutTest")
             | .testsuite[] | select(.result != "COMPLETED") | .name] | join(", ")
          ' /tmp/wayland-tests.json)"
          if [ -n "${skipped}" ]; then
            echo "::error::The compositor fixture is not reaching the tests. Skipped: ${skipped}"
            echo "--- sway log ---"; cat /tmp/sway.log
            exit 1
          fi
          echo "The live layout suite ran against the compositor."

  # ===========================================
  # Arch Linux Package (PKGBUILD)
  # ===========================================
  build-arch-pkg:
    # Gate every package build on the test suite: nothing is compiled, and
    # therefore nothing is ever released or published as nightly, unless the
    # tests pass first.
    needs: [test, version]
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    # The native build uses this release version for binary metadata.
    env:
      BRANCH: ${{ github.ref_name }}
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}

    steps:
      # Cache the downloaded pacman packages so a run pays the extraction cost
      # rather than the download; pacman keeps them in /var/cache/pacman/pkg.
      # The CUDA toolkit is no longer among them - see the CUDA step below.
      - name: Cache pacman packages
        uses: actions/cache@v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-arch-cuda-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: |
            pacman-arch-cuda-

      - name: Setup Arch Linux
        run: |
          pacman -Syu --noconfirm
          # The PKGBUILD requires the pinned CUDA toolkit for releases.
          # wget and zstd fetch and unpack the pinned build inputs.
          pacman -S --noconfirm --needed \
            base-devel \
            wget \
            zstd \
            git \
            git-lfs \
            ninja \
            jq \
            nlohmann-json \
            patchelf \
            python \
            openssl \
            opus \
            ffmpeg \
            libdrm \
            wayland \
            libx11 \
            libxrandr \
            libxfixes \
            libxcb \
            libxext \
            libxtst \
            libva \
            libvdpau \
            libcap \
            acl \
            curl \
            libevdev \
            libisl \
            libmpc \
            systemd \
            miniupnpc \
            libpulse \
            libpipewire \
            plasma-wayland-protocols \
            qt6-base \
            qt6-svg \
            npm \
            nodejs \
            icu \
            numactl

          # Create build user (makepkg can't run as root)
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
          persist-credentials: false

      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      # makepkg cannot take pkgver from the environment, so rewrite it in the
      # CI checkout. This keeps the package filename, the pacman version and
      # the version the binary reports all in agreement.
      - name: Check candidate upgrade ordering
        run: |
          case "$BRANCH" in
            release/*-rc*)
              test "$(vercmp "$BUILD_VERSION" '0.6.0+964c5fa')" -gt 0
              rc_number="${BRANCH##*-rc}"
              if [ "$rc_number" -ge 3 ]; then
                test "$(vercmp "$BUILD_VERSION" '0.6.0+20261026.rc2.f8ae5a5')" -gt 0
              fi
              ;;
          esac

      - name: Stamp the build version into the PKGBUILD
        run: |
          sed -i "s/^pkgver=.*/pkgver=${BUILD_VERSION}/" PKGBUILD
          grep '^pkgver=' PKGBUILD

      - name: Fix permissions and git
        run: |
          chown -R builder:builder .
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Download the CUDA-only GCC 14 compiler
        shell: bash
        run: |
          compiler_root="$PWD/target/arch-cuda-host-gcc"
          host_cxx="$(runuser -u builder -- env -i \
            HOME=/home/builder PATH=/usr/bin:/bin LANG=C.UTF-8 \
            bash scripts/install_cuda_host_gcc.sh "$CUDA_HOST_GCC" "$compiler_root")"
          echo "CUDA_HOST_CXX=${host_cxx}" >> "$GITHUB_ENV"

      # Keep CUDA 12.9's older GPU coverage. The unprivileged package build
      # uses the toolkit from /usr/local and the CUDA-only compiler under target.
      - name: Install CUDA toolkit
        run: scripts/install_cuda_redist.sh "${CUDA_VERSION}"

      # Build the real Arch package straight from the PKGBUILD, so CI and a
      # local `makepkg -si` produce the exact same
      # hermes-streaming-*.pkg.tar.zst (same paths, service, deps). makepkg
      # refuses to run as root, hence the `builder` user created above.
      - name: Build package with makepkg
        run: |
          # The pinned nvcc and compatible host compiler are both needed
          # by the PKGBUILD's native CUDA feature.
          # Pass the package inputs explicitly. The runner's command file
          # is owned by root and is unavailable to makepkg.
          node_bin="$(dirname "$(command -v node)")"
          su builder -c "export PATH='/usr/local/cuda/bin:${node_bin}':\$PATH \
            CUDAHOSTCXX='${CUDA_HOST_CXX}' \
            BRANCH='${BRANCH}' \
            BUILD_VERSION='${BUILD_VERSION}' \
            COMMIT='${COMMIT}'; \
            env -u GITHUB_ENV makepkg -sf --noconfirm"

      # The Arch package must include the private KWin transport.
      - name: Check the detached desktop transport
        run: |
          pkg="$(ls hermes-streaming-[0-9]*.pkg.tar.zst | head -n1)"
          if bsdtar -tf "$pkg" | grep -qx 'usr/bin/hermes-detached-session'; then
            echo "::notice title=Detached desktop (Arch)::KWin transport built; hermes-detached-session is packaged"
          else
            echo "::error title=Detached desktop (Arch)::hermes-detached-session is missing; the KWin transport was not built"
            exit 1
          fi

      - name: Upload Arch Package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hermes-streaming-arch-pkg
          # Both the package and its symbols. The -debug package is what makes a
          # user's coredump readable; publishing only the stripped binary is why
          # the crash reports so far could not be resolved past raw offsets.
          path: |
            *.pkg.tar.zst
          retention-days: 30
          if-no-files-found: error

  # ===========================================
  # Debian/Ubuntu Package (.deb)
  # ===========================================
  # One package per supported Ubuntu LTS, for the same reason the RPM job
  # builds per Fedora release: the libraries a package links move between
  # releases. The build runs in a plain `ubuntu:<release>` container rather than
  # on the runner image, so the binary can only link what that release actually
  # ships - a runner image carries a great deal of extra software, and anything
  # the build picked up from it would become a dependency users do not have.
  #
  # Add a row when a new LTS ships and drop it at EOL:
  # https://wiki.ubuntu.com/Releases
  build-deb:
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Both releases build their CUDA the same way; see the CUDA_VERSION
          # comment at the top of the workflow.
          - ubuntu: "24.04"
          - ubuntu: "26.04"
    container:
      image: ubuntu:${{ matrix.ubuntu }}
    env:
      DEBIAN_FRONTEND: noninteractive
      BRANCH: ${{ github.ref_name }}
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}

    steps:
      # Before the checkout: a bare container has no git, and the submodule
      # checkout needs one.
      - name: Install Dependencies
        run: |
          apt-get update
          apt-get install -y \
            ca-certificates \
            curl \
            git \
            wget \
            xz-utils \
            build-essential \
            ninja-build \
            libssl-dev \
            nlohmann-json3-dev \
            patchelf \
            pkg-config \
            python3 \
            libpulse-dev \
            libopus-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libdrm-dev \
            libgbm-dev \
            libvulkan-dev \
            libwayland-dev \
            libpipewire-0.3-dev \
            plasma-wayland-protocols \
            libx11-dev \
            libxrandr-dev \
            libxfixes-dev \
            libxtst-dev \
            libxcb1-dev \
            libxcb-shm0-dev \
            libxcb-xfixes0-dev \
            libva-dev \
            libvdpau-dev \
            libcap-dev \
            libacl1-dev \
            libcurl4-openssl-dev \
            libevdev-dev \
            libudev-dev \
            libsystemd-dev \
            systemd-dev \
            libminiupnpc-dev \
            libicu-dev \
            libnuma-dev \
            libqt6svg6-dev \
            qt6-base-dev \
            dpkg-dev \
            debhelper

      - name: Check candidate upgrade ordering
        run: |
          case "$BRANCH" in
            release/*-rc*)
              dpkg --compare-versions "$BUILD_VERSION" gt '0.6.0+964c5fa'
              rc_number="${BRANCH##*-rc}"
              if [ "$rc_number" -ge 3 ]; then
                dpkg --compare-versions "$BUILD_VERSION" gt '0.6.0+20261026.rc2.f8ae5a5'
              fi
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Fix git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # Install the CUDA toolkit so the .deb ships NVIDIA NVENC, matching the
      # Arch and RPM packages. Only nvcc, its runtime and the headers it needs
      # are fetched, never the driver stack. Hermes links libcudart statically,
      # so nothing of the toolkit follows into the package. Runs after the
      # checkout because both halves are scripts out of the tree.
      - name: Install CUDA toolkit
        run: |
          host_cxx="$(scripts/install_cuda_host_gcc.sh "${CUDA_HOST_GCC}")"
          scripts/install_cuda_redist.sh "${CUDA_VERSION}" "$PWD/.toolchain/cuda-12.9"
          echo "CUDAHOSTCXX=${host_cxx}" >> "${GITHUB_ENV}"

      - name: Prepare native build inputs
        shell: bash
        run: |
          export MCPP_HOME="$PWD/.mcpp/local-home"
          export MCPP_TOOLCHAIN="path:$PWD/.toolchain"
          bash scripts/prepare-mcpp-ci.sh "${CUDA_HOST_GCC}"
          bash scripts/prepare-mcpp-linux-sdk.sh
          npm install --no-audit --no-fund
          {
            echo "MCPP_HOME=${MCPP_HOME}"
            echo "MCPP_TOOLCHAIN=${MCPP_TOOLCHAIN}"
          } >> "$GITHUB_ENV"

      - name: Build pinned PyroWave SDK
        run: bash scripts/build-pyrowave-sdk.sh

      - name: Build Hermes and Linux tools with mcpp
        shell: bash
        run: |
          export HERMES_MCPP_QT_MOC=/usr/lib/qt6/libexec/moc
          export HERMES_MCPP_PYROWAVE_RUNPATH="/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/hermes"

          features=cuda,package-assets,xtest,pyrowave,tray
          tools=(-p hermes-kms-card-broker -p hermes-session-broker -p hermes-gamemode)
          protocols=/usr/share/plasma-wayland-protocols
          if [[ -r "$protocols/fake-input.xml" ]] &&
             grep -Eq 'name="zkde_screencast_unstable_v1"[[:space:]]+version="([6-9]|[1-9][0-9]+)"' "$protocols/zkde-screencast-unstable-v1.xml"; then
            features+=,kwin
            tools+=(-p hermes-detached-session)
          fi

          "$MCPP_HOME/bin/mcpp" build --offline --release -p hermes-host --features "$features"
          host_result="$(python3 -c 'import json; print(json.load(open("target/.last-result.json"))["data"]["result"])')"
          echo "HERMES_HOST_RESULT=${host_result}" >> "$GITHUB_ENV"
          "$MCPP_HOME/bin/mcpp" build --offline --release "${tools[@]}"

      - name: Create DEB Package
        shell: bash
        run: |
          VERSION="${BUILD_VERSION}"
          PKGDIR="target/hermes_${VERSION}_amd64"

          # Everything the package ships comes from the project's own install
          # rules, as the Arch package already does. Assembling the tree here
          # by hand is what left the .deb without icons and with a cut-down
          # copy of the systemd unit, and the .rpm without a menu entry at
          # all (#52).
          LIBDIR="lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          packaging/linux/stage-install.sh --mcpp "${PKGDIR}" \
            --result "$HERMES_HOST_RESULT" --result target/.last-result.json \
            --libdir "$LIBDIR" --tray > /dev/null
          mkdir -p ${PKGDIR}/DEBIAN

          # Derive the dependencies from what the binary actually links, the
          # way debhelper does for a normal Debian build. The hand-written list
          # this replaces was wrong in both directions: it required
          # libboost-all-dev - a build-time -dev metapackage, and Boost is
          # linked statically here anyway - while naming neither libicu nor
          # libminiupnpc, the two libraries whose sonames actually move between
          # releases (24.04 has libicu74/libminiupnpc17, 26.04 libicu78/
          # libminiupnpc21). A missing entry is the worse half of that: apt
          # installs the package without complaint and the binary then fails to
          # start, which is far harder to diagnose than a refused install.
          #
          # dpkg-shlibdeps reads debian/control for the package name, so give it
          # a throwaway one rather than a full debian/ source tree.
          CODEC_LIB_PATH="$(readlink -f "${PKGDIR}/usr/${LIBDIR}/hermes")"
          # The session broker is a separate executable with its own dependencies
          # (notably libacl). Scan every staged ELF, including the private codec,
          # rather than deriving the package's dependencies only from Hermes.
          ELF_ARGS=()
          while IFS= read -r -d '' candidate; do
            if readelf -h "$candidate" >/dev/null 2>&1; then
              ELF_ARGS+=("-e$(readlink -f "$candidate")")
            fi
          done < <(find "${PKGDIR}/usr/bin" "${CODEC_LIB_PATH}" -type f -print0)
          (( ${#ELF_ARGS[@]} > 0 ))
          mkdir -p target/deb-shlibdeps/debian
          printf 'Source: hermes\nPackage: hermes\nArchitecture: amd64\n' \
            > target/deb-shlibdeps/debian/control
          DEB_DEPENDS="$(cd target/deb-shlibdeps \
            && dpkg-shlibdeps -O --ignore-missing-info -l"${CODEC_LIB_PATH}" "${ELF_ARGS[@]}" \
            | sed 's/^shlibs:Depends=//')"
          rm -rf target/deb-shlibdeps
          if [ -z "${DEB_DEPENDS}" ]; then
            echo "dpkg-shlibdeps produced no dependencies" >&2
            exit 1
          fi
          echo "Generated Depends: ${DEB_DEPENDS}"

          # Create control file
          cat > ${PKGDIR}/DEBIAN/control << EOF
          Package: hermes
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Depends: ${DEB_DEPENDS}, libvulkan1, libcap2-bin
          Recommends: evdi-dkms
          Maintainer: Hermes
          Description: Self-hosted game stream host with Linux virtual display support
           Hermes is an Apollo-derived game streaming server with low-latency
           Linux virtual displays via Hermes-KMS (EVDI also supported).
          EOF

          # Create postinst script
          cat > ${PKGDIR}/DEBIAN/postinst << 'EOF'
          #!/bin/bash
          set -e
          setcap cap_sys_admin,cap_mknod,cap_sys_chroot+p /usr/bin/hermes || true
          if command -v modprobe &> /dev/null; then
            modprobe evdi 2>/dev/null || true
          fi
          gtk-update-icon-cache -f /usr/share/icons/hicolor/ 2>/dev/null || true
          update-desktop-database /usr/share/applications 2>/dev/null || true
          EOF
          chmod 755 ${PKGDIR}/DEBIAN/postinst

          # The systemd unit and the three desktop entries come from the
          # staged install. The unit written here before was a cut-down copy:
          # it lacked the monitor recovery run on stop, and was wanted only by
          # xdg-desktop-autostart.target, which Game Mode sessions never
          # activate - so the package undid the fix that makes Hermes start
          # there.

          # Build package. The release goes in the filename so the two builds
          # are told apart on the release page - the control Version stays the
          # plain upstream version, so neither package looks like an upgrade of
          # the other.
          dpkg-deb --build ${PKGDIR} \
            hermes_${VERSION}_ubuntu${{ matrix.ubuntu }}_amd64.deb

      - name: Install and test DEB with file capabilities
        shell: bash
        run: |
          apt-get install -y libcap2-bin util-linux
          apt-get install -y ./hermes_*_ubuntu${{ matrix.ubuntu }}_amd64.deb
          bash scripts/tests/package-loader-smoke.sh "/usr/lib/$(dpkg-architecture -qDEB_HOST_MULTIARCH)/hermes"

      # The detached desktop is omitted when the distro's screen-cast
      # protocol predates version 6.
      - name: Report the detached desktop transport
        run: |
          if dpkg-deb -c hermes_*_ubuntu${{ matrix.ubuntu }}_amd64.deb | grep -q '/usr/bin/hermes-detached-session$'; then
            echo "::notice title=Detached desktop (Ubuntu ${{ matrix.ubuntu }})::KWin transport built; hermes-detached-session is packaged"
          else
            echo "::warning title=Detached desktop (Ubuntu ${{ matrix.ubuntu }})::KWin transport not built (plasma-wayland-protocols lacks screencast v6); Detached Desktop is unavailable in this package"
          fi

      - name: Upload DEB Package
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hermes-deb-ubuntu${{ matrix.ubuntu }}
          # Only the Hermes package, not build-time debs (e.g. cuda-keyring).
          path: "hermes_*.deb"
          retention-days: 30
          if-no-files-found: error

  # ===========================================
  # Fedora RPM Build
  # ===========================================
  # One package per supported Fedora release, not one package for "Fedora".
  # rpmbuild derives a package's Requires from the sonames the binary actually
  # linked against, so a build picks up whatever ICU and miniupnpc the build
  # container shipped (libicuuc.so.74, libminiupnpc.so.17 on Fedora 40) and then
  # refuses to install anywhere those have moved on. A single build on an
  # already-EOL release left every current Fedora unable to install it.
  #
  # Add a row when Fedora branches a new release and drop it when that release
  # goes EOL: https://docs.fedoraproject.org/en-US/releases/eol/
  build-rpm:
    needs: [test, version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Every release builds its CUDA the same way; see the CUDA_VERSION
          # comment at the top of the workflow. Fedora 43 still packages gcc14,
          # Fedora 44 and 45 do not, and install_cuda_host_gcc.sh covers them by
          # taking the compat compiler from the newest earlier release that has
          # it. Keep the RPM count in the release-candidate job in step.
          - fedora: "43"
          - fedora: "44"
          - fedora: "45"
    container:
      image: fedora:${{ matrix.fedora }}
    env:
      BRANCH: ${{ github.ref_name }}
      BUILD_VERSION: ${{ needs.version.outputs.build_version }}

    steps:
      - name: Install Dependencies
        run: |
          dnf install -y \
            git \
            curl \
            python3 \
            libstdc++-static \
            libatomic \
            patchelf \
            pkgconf-pkg-config \
            json-devel \
            systemd \
            libXext-devel \
            libXtst-devel \
            libXcomposite-devel \
            libXinerama-devel \
            libXi-devel \
            ninja-build \
            gcc-c++ \
            boost-devel \
            openssl-devel \
            opus-devel \
            ffmpeg-free-devel \
            libdrm-devel \
            mesa-libgbm-devel \
            vulkan-headers \
            vulkan-loader-devel \
            wayland-devel \
            pipewire-devel \
            plasma-wayland-protocols-devel \
            libX11-devel \
            libXrandr-devel \
            libXfixes-devel \
            libxcb-devel \
            libva-devel \
            libvdpau-devel \
            libcap-devel \
            libacl-devel \
            libcurl-devel \
            libevdev-devel \
            systemd-devel \
            miniupnpc-devel \
            pulseaudio-libs-devel \
            libicu-devel \
            numactl-devel \
            qt6-qtbase-devel \
            qt6-qtsvg-devel \
            rpm-build \
            wget

      - name: Check candidate upgrade ordering
        run: |
          case "$BRANCH" in
            release/*-rc*)
              test "$(rpm --eval "%{lua: print(rpm.vercmp('${BUILD_VERSION}', '0.6.0+964c5fa'))}")" -gt 0
              rc_number="${BRANCH##*-rc}"
              if [ "$rc_number" -ge 3 ]; then
                test "$(rpm --eval "%{lua: print(rpm.vercmp('${BUILD_VERSION}', '0.6.0+20261026.rc2.f8ae5a5'))}")" -gt 0
              fi
              ;;
          esac

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up the pinned Node.js runtime
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version

      - name: Fix git safe directory
        run: git config --global --add safe.directory "${GITHUB_WORKSPACE}"

      # Use the CUDA release that preserves the GPU coverage of the RPM builds.
      - name: Install CUDA toolkit
        run: |
          host_cxx="$(scripts/install_cuda_host_gcc.sh "${CUDA_HOST_GCC}")"
          scripts/install_cuda_redist.sh "${CUDA_VERSION}" "$PWD/.toolchain/cuda-12.9"
          echo "CUDAHOSTCXX=${host_cxx}" >> "${GITHUB_ENV}"

      - name: Prepare native build inputs
        shell: bash
        run: |
          export MCPP_HOME="$PWD/.mcpp/local-home"
          export MCPP_TOOLCHAIN="path:$PWD/.toolchain"
          scripts/prepare-mcpp-ci.sh
          scripts/prepare-mcpp-linux-sdk.sh
          npm install --no-audit --no-fund
          printf 'MCPP_HOME=%s\nMCPP_TOOLCHAIN=%s\n' "$MCPP_HOME" "$MCPP_TOOLCHAIN" >> "$GITHUB_ENV"

      - name: Build pinned PyroWave SDK
        run: bash scripts/build-pyrowave-sdk.sh

      - name: Build Hermes and Linux tools with mcpp
        shell: bash
        run: |
          export HERMES_MCPP_PYROWAVE_RUNPATH="$(rpm --eval '%{_libdir}')/hermes"
          features=cuda,package-assets,xtest,pyrowave,tray
          tools=(-p hermes-kms-card-broker -p hermes-session-broker -p hermes-gamemode)
          protocols=/usr/share/plasma-wayland-protocols
          if [[ -r "$protocols/fake-input.xml" ]] &&
             grep -Eq 'name="zkde_screencast_unstable_v1"[[:space:]]+version="([6-9]|[1-9][0-9]+)"' "$protocols/zkde-screencast-unstable-v1.xml"; then
            features+=,kwin
            tools+=(-p hermes-detached-session)
          fi
          "$MCPP_HOME/bin/mcpp" build --offline --release -p hermes-host --features "$features"
          host_result="$(python3 -c 'import json; print(json.load(open("target/.last-result.json"))["data"]["result"])')"
          echo "HERMES_HOST_RESULT=${host_result}" >> "$GITHUB_ENV"
          "$MCPP_HOME/bin/mcpp" build --offline --release "${tools[@]}"

      - name: Create RPM Package
        id: rpm
        run: |
          packaging/linux/stage-install.sh --mcpp target/hermes-payload \
            --result "$HERMES_HOST_RESULT" --result target/.last-result.json \
            --libdir "$(rpm --eval '%{_lib}')" --tray > /dev/null
          artifact="$(packaging/linux/rpm/build-rpm.sh)"
          printf 'path=%s\n' "$artifact" >> "$GITHUB_OUTPUT"

      # The release jobs collect target/release-artifacts/**/*, so each leg needs its own
      # artifact name; the packages themselves are already distinct, since
      # %{?dist} stamps the release as .fc43 / .fc44 / .fc45.
      - name: Install and test RPM with file capabilities
        shell: bash
        env:
          HERMES_RPM: ${{ steps.rpm.outputs.path }}
        run: |
          dnf install -y util-linux
          dnf install -y "$HERMES_RPM"
          bash scripts/tests/package-loader-smoke.sh "$(rpm --eval '%{_libdir}')/hermes"

      # Older Plasma protocol packages lack screencast v6. The build then leaves
      # the detached desktop out. Say which way this package went.
      - name: Report the detached desktop transport
        env:
          HERMES_RPM: ${{ steps.rpm.outputs.path }}
        run: |
          if rpm -qlp "$HERMES_RPM" | grep -qx '/usr/bin/hermes-detached-session'; then
            echo "::notice title=Detached desktop (Fedora ${{ matrix.fedora }})::KWin transport built; hermes-detached-session is packaged"
          else
            echo "::warning title=Detached desktop (Fedora ${{ matrix.fedora }})::KWin transport not built (plasma-wayland-protocols lacks screencast v6); Detached Desktop is unavailable in this package"
          fi

      - name: Upload RPM
        uses: actions/upload-artifact@v7.0.2
        with:
          name: hermes-rpm-fc${{ matrix.fedora }}
          path: ${{ steps.rpm.outputs.path }}
          retention-days: 30
          if-no-files-found: error

  # ===========================================
  # Create Release (on tag)
  # ===========================================
  # Promoting a nightly to a stable release is done by pushing a vX.Y.Z tag
  # (scripts/bump-version.sh does this). The tag push re-runs the full pipeline
  # — test -> build -> release — so a stable release is always freshly built
  # from tested sources rather than reusing a nightly artifact. Because every
  # build job needs [test], this release cannot publish unless the suite passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb, build-arch-pkg, build-rpm, package-loader]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: target/release-artifacts/

      - name: List artifacts
        run: find target/release-artifacts/ -type f

      - name: Create Release
        uses: softprops/action-gh-release@v3.0.4
        with:
          files: |
            target/release-artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ===========================================
  # Nightly Release (rolling prerelease on main)
  # ===========================================
  # Every successful push to main refreshes the single "nightly" prerelease
  # with the latest Linux artifacts. The tag is force-moved to the current
  # commit so the release always points at the newest build.
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, build-deb, build-arch-pkg, build-rpm, package-loader]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          path: target/release-artifacts/

      - name: List artifacts
        run: find target/release-artifacts/ -type f

      # Moved through the API rather than with `git push`. The push is
      # authenticated as the github-actions App, and GitHub refuses a ref push
      # that carries a change to .github/workflows without the `workflows`
      # permission - which GITHUB_TOKEN cannot be granted, because there is no
      # such key in the `permissions:` block. So every commit that touches a
      # workflow file failed to publish a nightly, with the packages built and
      # the release never updated. Updating a ref to a commit that is already
      # on the remote adds no file content, and is not subject to that check.
      - name: Move nightly tag to current commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/nightly" \
              -f sha="${GITHUB_SHA}" -F force=true \
            || gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/nightly" -f sha="${GITHUB_SHA}"

      - name: Clear stale nightly assets
        run: |
          # Remove all assets from the existing nightly release so a version
          # bump never leaves old-versioned packages behind. Ignores the case
          # where the release doesn't exist yet.
          for asset in $(gh release view nightly --json assets -q '.assets[].name' 2>/dev/null); do
            gh release delete-asset nightly "$asset" --yes || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish nightly release
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: nightly
          name: "Hermes nightly (v${{ needs.version.outputs.build_version }})"
          body: |
            Rolling nightly build of Hermes from the `main` branch.

            - Version: `v${{ needs.version.outputs.build_version }}`
            - Commit: ${{ github.sha }}
            - Built: ${{ github.event.head_commit.timestamp }}

            > These artifacts are automatically rebuilt on every push to
            > `main` and may be unstable. For tagged releases see the
            > non-prerelease entries.
          files: |
            target/release-artifacts/**/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A release/<tag> branch builds and publishes a new immutable candidate only
  # after the host suite, all native packages and the secure loader matrix pass.
  release-candidate:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/') && contains(github.ref_name, '-rc')
    needs: [version, test, build-deb, build-arch-pkg, build-rpm, package-loader]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          path: target/release-artifacts/
      - name: Prepare verified candidate payloads
        env:
          BUILD_VERSION: ${{ needs.version.outputs.build_version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME#release/}"
          [[ "$tag" =~ ^[a-z]+-[0-9]{4}-rc[0-9]+$ ]]
          # Refuse to replace an already published candidate or an existing tag.
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" >/dev/null 2>&1; then
            echo "Candidate ${tag} already exists; choose the next RC." >&2
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/${tag}"; then
            echo "Candidate tag ${tag} already exists; refusing to move it." >&2
            exit 1
          fi
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha)"
          test "$current_sha" = "$GITHUB_SHA"
          mkdir -p target/release-payload
          find target/release-artifacts/ -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.pkg.tar.zst' \) -exec cp -t target/release-payload -- {} +
          test "$(find target/release-payload -name '*.deb' | wc -l)" -eq 2
          # One per build-rpm matrix row.
          test "$(find target/release-payload -name '*.rpm' | wc -l)" -eq 3
          test "$(find target/release-payload -name 'hermes-streaming-*.pkg.tar.zst' | wc -l)" -ge 1
          notes="docs/${tag}-notes.md"
          test -s "$notes"
          export RC_TAG="$tag"
          printf 'RC_NOTES=%s\n' "$notes" >> "$GITHUB_ENV"
          python3 - <<'PYTHON'
          import hashlib, json, os
          from pathlib import Path
          payload = Path('target/release-payload')
          files = {p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(payload.iterdir())}
          manifest = {
              'tag': os.environ['RC_TAG'],
              'source_commit': os.environ['GITHUB_SHA'],
              'build_version': os.environ['BUILD_VERSION'],
              'workflow_run': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              'validation': ['host-tests', 'fedora-43-44-45-secure-loader', 'ubuntu-24.04-26.04-secure-loader', 'installed-rpm-deb-non-root-startup'],
              'payload_sha256': files,
          }
          (payload / 'RC_MANIFEST.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PYTHON
          (cd target/release-payload && sha256sum *.deb *.rpm *.pkg.tar.zst RC_MANIFEST.json > SHA256SUMS)
          printf 'RC_TAG=%s\n' "$tag" >> "$GITHUB_ENV"
      - name: Publish tested release candidate
        uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ env.RC_TAG }}
          target_commitish: ${{ github.sha }}
          name: "Hermes — ${{ env.RC_TAG }}"
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body_path: ${{ env.RC_NOTES }}
          files: target/release-payload/*
