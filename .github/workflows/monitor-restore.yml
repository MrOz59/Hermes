name: Linux monitor restoration regressions

on:
  pull_request:
    paths:
      - 'src/platform/linux/virtual_display.*'
      - 'src/platform/linux/monitor_restore.h'
      - 'src/platform/linux/bounded_command.h'
      - 'src/platform/linux/process_group.h'
      - 'src/process.cpp'
      - 'tests/display_restore/**'
      - 'scripts/prepare-mcpp-ci.sh'
      - '.github/workflows/monitor-restore.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install GCC 14 and Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl g++-14 ninja-build
      - name: Prepare mcpp with the runner toolchain
        run: |
          export MCPP_HOME="$RUNNER_TEMP/hermes-monitor-mcpp"
          export MCPP_TOOLCHAIN="path:$RUNNER_TEMP/hermes-monitor-gcc"
          scripts/prepare-mcpp-ci.sh 14
          printf 'MCPP_HOME=%s\nMCPP_TOOLCHAIN=%s\n' "$MCPP_HOME" "$MCPP_TOOLCHAIN" >> "$GITHUB_ENV"
          printf '%s\n' "$MCPP_HOME/bin" >> "$GITHUB_PATH"
      - name: Compile production restoration and subprocess helpers with sanitizers
        working-directory: tests/display_restore
        run: mcpp build --offline --profile sanitize
      - name: Verify partial recovery, retries, headless layouts and real helper timeouts
        working-directory: tests/display_restore
        run: mcpp run --offline --profile sanitize hermes-monitor-restore
