[package]
name = "hermes-libdisplaydevice"
version = "0.0.0"
description = "Common portion of the libdisplaydevice submodule"
standard = "gnu++26"

[build]
sources = ["../../third-party/libdisplaydevice/src/common/*.cpp"]
include_dirs = [
    "../../third-party/libdisplaydevice/src/common/include",
    "../../.toolchain/json-include",
]
private_include_dirs = ["../../.toolchain/json-include"]

# Use GNU extensions for the common library even under a strict root target.
[[build.flags]]
glob = "../../third-party/libdisplaydevice/src/common/*.cpp"
cxxflags = ["-std=gnu++26"]

[targets.hermes-libdisplaydevice]
kind = "lib"
