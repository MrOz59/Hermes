# EVDI, the default virtual display backend. Loaded at boot so a virtual
# display works without root: Hermes cannot load a module itself.
#
# Image-based systems such as Bazzite ship the module prebuilt but load
# nothing, and accept no change to /usr after install. A system without EVDI
# only logs "Failed to find module 'evdi'" here; the boot is unaffected.
evdi
